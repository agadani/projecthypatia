# Suggested papers, grouped by subfield.
# See README.md ("Adding a paper") for instructions.
#
# Each paper looks like this (copy, paste, and fill in):
#
#   - title: "Title of the paper"
#     link: "https://link-to-the-pdf-or-doi"       # optional
#     authors:
#       - name: "A. Author"                         # an author to highlight (shown in bold)
#         link: "https://her-homepage"              # optional
#         highlight: true
#       - "B. Coauthor"                             # other authors: just the name
#     venue: "Conference or journal, year."
#     note: "Optional extra sentence."              # optional
#
# Text in venue and note may use Markdown, e.g. [link text](https://...) or **bold**.

